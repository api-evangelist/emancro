aid: emancro
name: Emancro
description: 'Emancro is an AI robotics company automating hospital logistics. Its
  flagship product, EASO, is described as the world''s first fully autonomous robot
  for hospital medication logistics: it streamlines supply distribution, restocks
  medication dispensing cabinets, and retrieves medications from pharmacy storage to
  reduce errors and free clinical staff to focus on patient care. The technology combines
  vision-language-action (VLA) models with geometric planning, and Emancro is piloting
  EASO with leading U.S. hospitals. The company is backed by Amplify Partners. Emancro
  is a physical-robotics and healthcare-AI company with no public developer API, SDK,
  or documentation surface at this time.'
